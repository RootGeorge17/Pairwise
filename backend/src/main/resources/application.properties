spring.application.name=Pair Wise Live Backend Service

spring.datasource.url=${PAIRWISE_DB_URL:jdbc:mariadb://localhost:3306/pairwise_db}
spring.datasource.username=${PAIRWISE_DB_USERNAME:pairwise_user}
spring.datasource.password=${PAIRWISE_DB_PASSWORD:change-me}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${PAIRWISE_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

pairwise.sandbox.cpus=${PAIRWISE_SANDBOX_CPUS:0.5}
pairwise.sandbox.pids-limit=${PAIRWISE_SANDBOX_PIDS_LIMIT:64}
pairwise.sandbox.tmpfs=${PAIRWISE_SANDBOX_TMPFS:/tmp:rw,noexec,nosuid,size=16m}
pairwise.sandbox.extra-timeout-buffer-ms=${PAIRWISE_SANDBOX_EXTRA_TIMEOUT_BUFFER_MS:1000}
pairwise.sandbox.max-output-bytes=${PAIRWISE_SANDBOX_MAX_OUTPUT_BYTES:65536}
pairwise.sandbox.enable-selinux-label=${PAIRWISE_SANDBOX_ENABLE_SELINUX_LABEL:true}
