spring.application.name=Pair Wise Live Backend Service

spring.datasource.url=${PAIRWISE_DB_URL}
spring.datasource.username=${PAIRWISE_DB_USERNAME}
spring.datasource.password=${PAIRWISE_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${PAIRWISE_JPA_SHOW_SQL:true}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

pairwise.sandbox.cpus=${PAIRWISE_SANDBOX_CPUS:0.5}
pairwise.sandbox.pids-limit=${PAIRWISE_SANDBOX_PIDS_LIMIT:64}
pairwise.sandbox.tmpfs=${PAIRWISE_SANDBOX_TMPFS:/tmp:rw,noexec,nosuid,size=16m}
pairwise.sandbox.extra-timeout-buffer-ms=${PAIRWISE_SANDBOX_EXTRA_TIMEOUT_BUFFER_MS:1000}
pairwise.sandbox.max-output-bytes=${PAIRWISE_SANDBOX_MAX_OUTPUT_BYTES:65536}
pairwise.sandbox.enable-selinux-label=${PAIRWISE_SANDBOX_ENABLE_SELINUX_LABEL:true}

pairwise.auth.jwt.secret=${PAIRWISE_JWT_SECRET}
pairwise.auth.jwt.access-token-expiry-ms=${PAIRWISE_ACCESS_TOKEN_EXPIRY_MS:900000}
pairwise.auth.jwt.refresh-token-expiry-ms=${PAIRWISE_REFRESH_TOKEN_EXPIRY_MS:1209600000}
pairwise.cors.allowed-origins=${PAIRWISE_CORS_ALLOWED_ORIGINS:http://localhost:5173}
pairwise.websocket.allowed-origins=${PAIRWISE_WEBSOCKET_ALLOWED_ORIGINS:http://localhost:5173}
